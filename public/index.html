<!DOCTYPE html>
<html lang="en" class="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" href="/source-icon.jpg">
<link rel="apple-touch-icon" href="/source-icon.jpg">
<link rel="stylesheet" href="/store.css">
<!--
  The source's page, laid out as a developer's page on Apple's web App Store:
  its title as the large title, then every app in source.json as a lockup
  that opens its page (app.html, at /app/<slug>). Sizes and colours are in
  store.css, from design-research/apple/app-store-web/NOTES.md. On a phone
  (touch, under 600 px) store.css lays it out from the App Store app's
  developer page instead, by the class "home" on <html>.
-->
</head>
<body>
<main class="page">

  <h1 class="large-title" id="name">Loading…</h1>

  <!-- SideStore first, deliberately. AltStore's AltServer wants iTunes and
       iCloud direct from Apple, which the Microsoft Store versions can't
       satisfy; SideStore refreshes on-device and doesn't hit that wall. The
       AltStore button is here because the source format is shared, not as a
       recommendation. The developer page has no buttons of its own; these
       are its View button's capsule, in the row the app page uses. -->
  <section class="shelf" id="sourceShelf">
    <div class="button-row source-buttons">
      <a class="get-button" id="side" href="#">Add to SideStore</a>
      <a class="get-button" id="alt" href="#">Add to AltStore</a>
      <button class="get-button" id="copy" type="button">Copy</button>
    </div>
    <p class="source-url" id="url"></p>
  </section>

  <section class="shelf" id="appsShelf" hidden>
    <div class="lockups" id="apps"></div>
  </section>

  <p class="missing" id="error" hidden></p>

</main>
<script src="/store.js"></script>
<script>
(function () {
  var S = Store, T = S.TEXT;
  var $ = function (id) { return document.getElementById(id); };

  $('side').textContent = T.addSideStore;
  $('alt').textContent = T.addAltStore;
  $('copy').textContent = T.copy;
  $('url').textContent = S.SOURCE_URL;
  S.sourceLinks($('side'), $('alt'));
  $('copy').addEventListener('click', function () { S.copySourceURL($('copy')); });

  S.loadSource()
    .then(function (src) {
      var apps = src.apps || [];
      if (!apps.length) throw new Error('no apps listed in source.json');
      document.title = T.title;
      $('name').textContent = T.title;
      apps.forEach(function (app) { $('apps').appendChild(S.lockup(app, false)); });
      $('appsShelf').hidden = false;
    })
    .catch(function (e) {
      document.title = T.unavailable;
      $('name').textContent = T.unavailable;
      $('error').textContent = T.couldNotLoad(e.message);
      $('error').hidden = false;
    });
})();
</script>
</body>
</html>
