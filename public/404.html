<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Ammy</title>
<meta name="robots" content="noindex">
<!--
  This file exists for its status code more than its contents.

  Without a 404.html, Cloudflare Pages answers an unmatched path with
  index.html and a 200. That is the right behaviour for a single-page app and
  the wrong one here: on 18 Sept 2026 a request for /source.json was read as
  "the source is deploying the landing page instead of the JSON", when in fact
  the file was live and the response was a cached fallback from before it
  existed. The control test — comparing against a nonsense path — could not
  tell the two apart, because a nonsense path returned the same 200 and the
  same 10798 bytes either way.

  A real 404 makes that mistake impossible to make: a missing file now says it
  is missing. It also matters for the sideloaders, which would otherwise be
  handed HTML where they asked for JSON and report a parse error rather than a
  wrong address.

  Deleting this file silently restores the trap.

  Styling is copied from index.html rather than shared, because a stylesheet
  would be a second request on the one page most likely to be reached by
  something already having a bad time.
-->
<style>
  /* Pretendard stands in for SF Pro where the device has no SF Pro: the
     owner's choice of stand-in. Unmodified from the 1.3.9 release, under the
     SIL Open Font License (fonts/Pretendard-LICENSE.txt). A browser that has
     -apple-system never fetches it. */
  @font-face {
    font-family: "Pretendard Std"; font-weight: 100 900; font-display: swap;
    src: url(/fonts/PretendardStdVariable.woff2) format("woff2");
  }

  /* UIKit's system colours (ios-system-colors): grouped background, cell,
     labels, separator, and iOS 27's blue and red. */
  :root {
    --bg: #f2f2f7; --cell: #ffffff;
    --label: #000000; --label2: rgba(60,60,67,0.6);
    --sep: rgba(60,60,67,0.29); --fill: rgba(120,120,128,0.12);
    --tint: #0088ff; --red: #ff383c; --barline: transparent;
    --font: -apple-system, "SF Pro Text", "Pretendard Std", system-ui, sans-serif;
    --font-display: -apple-system, "SF Pro Display", "Pretendard Std", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --cell: #1c1c1e;
      --label: #ffffff; --label2: rgba(235,235,245,0.6);
      --sep: rgba(84,84,88,0.65); --fill: rgba(118,118,128,0.24);
      --tint: #0091ff; --red: #ff4245;
    }
  }

  body {
    margin: 0; background: var(--bg); color: var(--label);
    font-family: var(--font); font-size: 17px; line-height: 22px;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }

  /* iOS 27, a pushed Settings page: a 54 pt bar whose title stays hidden
     while the header card shows the name, groups 16 pt from the screen's
     sides, 35 pt apart. */
  .bar {
    position: sticky; top: 0; z-index: 5; height: 54px; background: var(--bg);
    border-bottom: 1px solid var(--barline); box-sizing: border-box;
  }
  .bar-in { display: flow-root; max-width: 640px; margin: 0 auto; padding: 0 64px; box-sizing: border-box; }
  .bar h2 {
    margin: 11.5px 0 0; font: 600 17px/21px var(--font); text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; visibility: hidden;
  }
  .bar.titled h2 { visibility: visible; }
  .col { max-width: 640px; margin: 0 auto; padding: 35px 16px 48px; box-sizing: border-box; }
  .gap { height: 35px; }

  /* Inset groups: corner 26, text 20 pt inside on iOS 27.2 (16 on 27.0),
     text rows 53 pt, hairline separators. */
  .group { background: var(--cell); border-radius: 26px; overflow: hidden; }
  .row {
    display: flex; align-items: center; position: relative; box-sizing: border-box;
    width: 100%; min-height: 53px; padding: 15.5px 20px; margin: 0;
    border: 0; background: none; font: inherit; color: inherit; text-align: left;
    text-decoration: none; overflow-wrap: anywhere;
  }
  .row + .row::before {
    content: ""; position: absolute; top: 0; left: 20px; right: 20px;
    height: 0.5px; background: var(--sep);
  }
  /* A row that does something is the button itself: its title in the tint,
     no chevron, since it opens another app or copies (settings-action-rows). */
  .act { color: var(--tint); cursor: pointer; }
  .act:focus-visible { outline: 2px solid var(--tint); outline-offset: -2px; border-radius: inherit; }
  .text { margin: 0; padding: 15.5px 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .header { margin: 0; padding: 0 20px 8px; font-size: 17px; line-height: 22px; font-weight: 600; color: var(--label2); }
  .footer { margin: 0; padding: 7px 20px 0; font-size: 13px; line-height: 18px; color: var(--label2); overflow-wrap: anywhere; }
  .footer code { font-family: var(--mono); font-size: 12px; word-break: break-all; }

  /* The header card, as Settings > General draws it on iOS 27.0: content
     15 pt from the card's top and bottom, a 60 pt icon, the name 15 pt below
     it at 22 pt bold, the description 4 pt below that at 17 pt in the
     secondary colour. */
  .head { padding: 15px 20px; }
  .icon { position: relative; width: 60px; height: 60px; border-radius: 22.37%; background: var(--fill); }
  .icon img { display: block; width: 100%; height: 100%; border-radius: inherit; }
  /* The owner's rule: a hairline on every picture, one device pixel in the
     separator colour, inside its edge (ios-pages-for-artifacts, Pictures). */
  .icon::after, .shot::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 0.5px var(--sep); pointer-events: none;
  }
  .head h1 { margin: 15px 0 0; font: 700 22px/26.5px var(--font-display); overflow-wrap: anywhere; }
  .head .icon[hidden] + h1 { margin-top: 0; }
  .path { font-family: var(--mono); font-size: 0.88em; word-break: break-all; }
  .head h1:first-child { margin-top: 0; }
  .desc { margin-top: 4px; color: var(--label2); overflow-wrap: anywhere; }
  .desc p { margin: 0; }
  .desc .err { color: var(--red); }

  /* Pictures sit inside a group card. */
  .shots { display: flex; gap: 12px; overflow-x: auto; padding: 16px; }
  .shot { position: relative; flex: none; border-radius: 10px; }
  .shot img { display: block; height: 380px; width: auto; border-radius: inherit; }

  /* iPadOS 27.2, Settings on an iPad Air 11-inch: a single page is one
     column like the detail column, groups 20 pt from both sides, at most
     820 pt wide, text 18 pt inside the cards; the header card's name is 20 pt
     below the icon and the description 8 pt below the name. */
  @media (min-width: 600px) and (hover: none), (min-width: 600px) and (pointer: coarse), (min-width: 600px) and (pointer: none) {
    .bar-in { max-width: 820px; }
    .col { max-width: 820px; padding-left: 20px; padding-right: 20px; }
    .row, .text { padding-left: 18px; padding-right: 18px; }
    .row + .row::before { left: 18px; right: 18px; }
    .header, .footer { padding-left: 18px; padding-right: 18px; }
    .head h1 { margin-top: 20px; }
    .desc { margin-top: 8px; }
  }

  /* macOS 27.0.1, System Settings in dark mode at 1x: a 52 pt band with a
     1 px line under it, the detail column's groups 20 pt in, 12 pt below the
     band, 10 pt apart, corner 12, text 13 pt 11 pt inside, text rows 37 pt,
     1 px separators. The header card is centred: a 48 pt icon 26 pt from the
     card's top, the name 12 pt below it at 22 pt bold, the description right
     under it at 13 pt, 20 pt from the card's bottom. Light mode isn't
     measured, so it keeps iOS's colours. */
  @media (hover: hover) and (pointer: fine) {
    :root { --barline: var(--sep); }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: rgb(30,30,30); --cell: rgb(37,37,37); --sep: rgb(47,47,47); --barline: rgb(46,46,46);
        --label: rgba(255,255,255,0.85); --label2: rgba(255,255,255,0.55);
      }
    }
    body { font-size: 13px; line-height: 16px; }
    .bar { height: 52px; }
    .bar-in { max-width: 700px; padding: 0 31px; }
    .bar h2 { margin-top: 16px; font: 700 15px/18px var(--font); text-align: left; }
    .col { max-width: 700px; padding: 12px 20px 48px; }
    .gap { height: 10px; }
    .group { border-radius: 12px; }
    .row { min-height: 37px; padding: 10.5px 11px; }
    .row + .row::before { left: 10px; right: 11px; height: 1px; }
    .text { padding: 10.5px 11px; }
    .header { font-size: 13px; line-height: 16px; font-weight: 700; color: var(--label); padding: 20px 11px 10px; }
    .footer { font-size: 11px; line-height: 14px; padding: 6px 11px 0; }
    .footer code { font-size: 10px; }
    .head { padding: 26px 10px 20px; text-align: center; }
    .icon { width: 48px; height: 48px; margin: 0 auto; }
    .head h1 { margin-top: 12px; font: 700 22px/26px var(--font-display); }
    .desc { margin-top: 0; }
    .shots { padding: 10px; }
  }
</style>
</head>
<body>

<div class="bar"></div>

<div class="col">

  <div class="group head">
    <h1>Not found</h1>
    <div class="desc"><p>Nothing is published at this address.</p></div>
  </div>

  <div class="gap"></div>

  <div class="group"><p class="text"><code class="path" id="path"></code></p></div>

  <div class="gap"></div>

  <div class="group"><a class="row act" href="/">Go to the Ammy page</a></div>

</div>
<script>
  // textContent, not innerHTML: the path is whatever was typed.
  document.getElementById('path').textContent = location.pathname + location.search;
</script>
</body>
</html>
