<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found</title>
<meta name="robots" content="noindex">
<!--
  This file exists for its status code more than its contents.

  Without a 404.html, Cloudflare Pages answers an unmatched path with
  index.html and a 200. That is the right behaviour for a single-page app and
  the wrong one here: on 18 Sept 2026 a request for /source.json was read as
  "the source is deploying the landing page instead of the JSON", when in fact
  the file was live and the response was a cached fallback from before it
  existed. The control test — comparing against a nonsense path — could not
  tell the two apart, because a nonsense path returned the same 200 and the
  same 10798 bytes either way.

  A real 404 makes that mistake impossible to make: a missing file now says it
  is missing. It also matters for the sideloaders, which would otherwise be
  handed HTML where they asked for JSON and report a parse error rather than a
  wrong address.

  Deleting this file silently restores the trap.

  Styling is copied from store.css rather than shared, because a stylesheet
  would be a second request on the one page most likely to be reached by
  something already having a bad time.
-->
<style>
  /* The developer page's title, body text and View button from Apple's web
     App Store (design-research/apple/app-store-web/NOTES.md), as in store.css. */
  @font-face { font-family: "Pretendard Std"; font-weight: 100 900; font-display: swap;
    src: url(/fonts/PretendardStdVariable.woff2) format("woff2"); }
  :root { --pageBg: #f5f5f7; --systemPrimary: #000000e0; --systemSecondary: #0000008f; --keyColor-rgb: 0, 122, 255; --button-alpha: 1;
    --bodyGutter: 25px; color-scheme: light dark;
    --font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Pretendard Std", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --pageBg: #151515; --systemPrimary: #ffffffeb; --systemSecondary: #ffffffa3; --button-alpha: 1.33; } }
  @media (min-width: 1000px) { :root { --bodyGutter: 40px; } }
  body { margin: 0; background: var(--pageBg); color: var(--systemPrimary); font: 400 13px/16px var(--font-family); -webkit-font-smoothing: antialiased; }
  main { max-width: 1680px; margin: 0 auto; }
  h1 { margin: 0; padding: 11px var(--bodyGutter); font: 700 26px/34px var(--font-family); letter-spacing: -0.5px; }
  p { margin: 8px var(--bodyGutter) 0; font: 400 13px/18px var(--font-family); color: var(--systemSecondary); overflow-wrap: anywhere; }
  @media (min-width: 1000px) { p { margin-top: 16px; } }
  code { font: 400 13px/18px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--systemPrimary); word-break: break-all; }
  .get-button { display: inline-block; margin: 16px var(--bodyGutter) 0; border-radius: 1000px; padding: 7px 16px; font: 700 13px/18px var(--font-family);
    color: #007aff; background-color: rgba(var(--keyColor-rgb), calc(var(--button-alpha) * .06)); text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Not found</h1>
  <p>Nothing is published at this address.</p>
  <p><code id="path"></code></p>
  <a class="get-button" href="/">[text]</a>
</main>
<script>
  // textContent, not innerHTML: the path is whatever was typed.
  document.getElementById('path').textContent = location.pathname + location.search;
</script>
</body>
</html>
