name: Ammy

options:
  bundleIdPrefix: com.local
  # iOS 26: safeAreaBar and the scroll edge effect behind the Start button in
  # AmmyApp.swift have no pre-26 equivalent, and a hand-rolled fallback would
  # look wrong on the only devices that would ever see it.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  Ammy:
    type: application
    platform: iOS
    sources:
      - path: Ammy

    info:
      path: Ammy/Info.plist
      properties:
        CFBundleDisplayName: Ammy
        # Declared explicitly rather than relying on XcodeGen's defaults, since
        # the settings screen reads both back at runtime. CI overrides
        # CURRENT_PROJECT_VERSION with a commit count (git rev-list --count
        # HEAD); build-ipa.yml says why it isn't the workflow run number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Reinstated 14 Sept 2026, for a different job than the scheme removed
        # on 11 Sept. That one backgrounded Ammy the moment it opened and raced
        # its own return; this one opens the app normally and does nothing but
        # ask that a connection failure arrive as a notification instead of a
        # popup, because whatever opened it is about to switch away.
        CFBundleURLTypes:
          - CFBundleURLName: com.local.ammy
            CFBundleURLSchemes:
              - ammy
        # The base key is the iPhone's; the ~ipad idiom suffix gives iPad its
        # own. So the phone stays locked to portrait and the tablet still turns
        # — enabling one does not cost the other.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # All four, because iPad apps get Split View and Slide Over by default
        # and both need every orientation. Not a build requirement — it is an
        # App Store submission check, and Ammy is sideloaded — but an iPad app
        # that refuses to turn is its own punishment.
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Deliberately says nothing about what the endpoint does with it. This
        # string is the iOS permission prompt and also appears in the source
        # listing's appPermissions, so it has to hold for any receiver.
        NSAppleMusicUsageDescription: >-
          Reads what you're currently playing so it can be sent to the endpoint
          you choose.
        # Required for the silent-audio keepalive in KeepAlive.swift.
        UIBackgroundModes:
          - audio

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ammy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The only version number a human sets. The build number beside it is
        # a commit count, passed in by build-ipa.yml — the "1" here is just a
        # placeholder for local builds.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 1 is iPhone, 2 is iPad. Was "1" with no note beside it, which read
        # like a default rather than a decision; iPad was added 14 Sept 2026 so
        # the layout could be looked at on a screen nobody here owns.
        TARGETED_DEVICE_FAMILY: "1,2"
        # This is the Swift *language mode*, not a compiler version.
        # Valid values are 4.0 / 4.2 / 5.0 / 6.0 — "5.9" is rejected.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
