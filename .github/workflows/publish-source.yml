name: Publish to AltStore source

# Every push to main that can change the app is a release: this builds an
# IPA, publishes it as a real GitHub Release, and updates public/source.json
# (and so what SideStore/AltStore offer) to match — automatically, no tagging
# step. This replaced a manual "bump MARKETING_VERSION, git tag -a v1.1 -m ...,
# push the tag" flow on 18 Sept 2026, because the whole point was to get a
# build onto the phone by pushing, not by remembering a second step.
#
# MARKETING_VERSION in project.yml is still the only version number a human
# sets. Bump it there and push, and that push publishes under the new number;
# leave it alone and every push publishes another build of the same version,
# distinguished by build number — a commit count — alone. build_source.py
# already replaces the previous entry for a given version rather than piling
# up one per build, so source.json only ever offers the newest build of "1.0";
# the GitHub Release for every build before it still exists, just not linked
# from there.
#
# The release's own tag (v<marketing>-b<build>) exists purely so GitHub has
# somewhere to hang the asset. Nothing reads it back — the version numbers
# that matter come from project.yml and the build job's commit count, not
# from parsing this string.

on:
  push:
    branches: [main]
    # Only build (and release) when something that can change the app
    # changes. Moved here from build-ipa.yml on 18 Sept 2026 along with the
    # trigger itself — see that file for why a build number has to mean
    # something. public/** matters doubly now: without this, the "Commit and
    # push" step below, which touches only public/source.json, would trigger
    # another run of this very workflow.
    paths-ignore:
      - '**.md'
      - 'bridge/**'
      - 'public/**'
      - 'scripts/**'
      - 'source.config.json'
  # Kept so a release can still be forced by hand — e.g. to republish after
  # editing source.config.json, which paths-ignore deliberately excludes from
  # triggering one on its own.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-ipa.yml

  publish:
    needs: build
    # No Xcode needed past this point, and Linux minutes bill at 1x against
    # macOS's 10x. The whole job is Python and git.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so the commit message below is readable

      # GitHub Releases need a tag, but there's no human-authored one anymore
      # — synthesize a unique one from numbers the build job already computed.
      - name: Work out the release tag
        id: tag
        run: |
          echo "tag=v${{ needs.build.outputs.marketing }}-b${{ needs.build.outputs.build }}" >> "$GITHUB_OUTPUT"

      # The "-release" artifact, not the plain one. build-ipa.yml uploads the
      # .ipa twice: the plain artifact uses archive: false so that a browser
      # download is the .ipa itself, and that same flag makes download-artifact
      # unpack it here — an .ipa is a zip, so what lands is Payload/ and no .ipa
      # at all. The -release copy uses default archiving and survives the trip.
      # See the comment beside both uploads in build-ipa.yml.
      - name: Download the .ipa built above
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.name }}-release
          path: dist

      # Resolved by search rather than reconstructed from the name, so a future
      # change to either the artifact naming or download-artifact's unpacking
      # can't silently point the Release and the source at a file that isn't
      # there. A wrong path here would publish a downloadURL that 404s.
      - name: Locate the .ipa
        id: ipa
        run: |
          # Deliberately not `set -e` here. The first version of this step was
          # `find dist -name '*.ipa' | head -n1` under `set -euo pipefail`, which
          # fails two ways: `head` closing the pipe early hands `find` a SIGPIPE,
          # so pipefail reports failure even when the file WAS found; and if
          # dist/ is missing, `find` exits non-zero and -e kills the step before
          # the diagnostic below ever prints. It failed silently for one of those
          # two reasons and there was no way to tell which.
          set -u

          echo "--- everything under dist/ ---"
          ls -laR dist 2>/dev/null || echo "(no dist directory at all)"
          echo "--- workspace root ---"
          ls -la

          # -print -quit rather than a pipe: no second process, no SIGPIPE.
          FOUND=$(find dist -type f -name '*.ipa' -print -quit 2>/dev/null)

          # The artifact is a single file, so if the extension didn't survive the
          # round trip, the only regular file under dist/ is still the right one.
          if [ -z "$FOUND" ]; then
            COUNT=$(find dist -type f 2>/dev/null | wc -l)
            if [ "$COUNT" = "1" ]; then
              FOUND=$(find dist -type f -print -quit 2>/dev/null)
              echo "No .ipa extension, but dist/ holds exactly one file. Using it."
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "::error::No .ipa under dist/ after download — see the listing above."
            exit 1
          fi

          echo "path=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Using $FOUND ($(stat -c%s "$FOUND") bytes)"

      # No tag to read an annotation from anymore — the commit that triggered
      # this build already says what changed, so use that. HEAD is already the
      # pushed commit; fetch-depth: 0 up top isn't needed for this specifically
      # but is cheap and was already there for the version-number history.
      - name: Write the changelog from the commit
        run: |
          set -euo pipefail
          # Trailers are for git, not for a subscriber reading What's New. A
          # trailing blank line where they used to be is harmless and not
          # worth a fragile sed pass to remove.
          git log -1 --format='%B' HEAD \
            | grep -vE '^(Co-Authored-By|Claude-Session|Signed-off-by): ' \
            > changelog.txt || true
          if [ ! -s changelog.txt ]; then
            echo "Version ${{ needs.build.outputs.marketing }} (build ${{ needs.build.outputs.build }})" > changelog.txt
          fi
          echo "--- changelog ---"
          cat changelog.txt

      # The Release is what actually hosts the .ipa. source.json only points at it,
      # so this has to succeed before the source is updated — a source entry whose
      # downloadURL 404s is worse than no entry at all.
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: changelog.txt
          files: ${{ steps.ipa.outputs.path }}
          fail_on_unmatched_files: true

      # public/source.json lives on main where it accumulates one entry per
      # version. It has to be edited against main's current tip, not whatever
      # commit was checked out when this job started: the build above takes a
      # minute or two, and another push landing in that window would mean
      # writing this update on top of a copy that's already stale, silently
      # dropping whatever that other push published.
      - name: Fetch the latest main before touching source.json
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Update source.json
        run: |
          set -euo pipefail
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/${{ needs.build.outputs.name }}.ipa"

          python3 scripts/build_source.py \
            --config source.config.json \
            --source public/source.json \
            --ipa "${{ steps.ipa.outputs.path }}" \
            --version "${{ needs.build.outputs.marketing }}" \
            --build-version "${{ needs.build.outputs.build }}" \
            --download-url "$DOWNLOAD_URL" \
            --changelog-file changelog.txt

      # Committing to main is what deploys: Cloudflare Pages watches this branch
      # and redeploys public/ on every push. public/** is in this workflow's own
      # paths-ignore, so this doesn't trigger another run of itself.
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/source.json
          if git diff --quiet --cached; then
            echo "source.json unchanged — nothing to push."
          else
            git commit -m "source: publish ${{ needs.build.outputs.marketing }} (build ${{ needs.build.outputs.build }})"
            git push origin main
            echo "Pushed. Cloudflare Pages redeploys in a minute or two."
          fi
