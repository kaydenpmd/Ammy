name: Publish to AltStore source

# Cutting a release:
#
#   1. Bump MARKETING_VERSION in project.yml and commit it.
#   2. git tag -a v1.1 -m "1.1" -m "- What changed
#      - The next thing that changed"
#   3. git push && git push origin v1.1
#
# The tag's message body becomes the changelog AltStore shows under What's New.
# The tag number and MARKETING_VERSION have to agree — the job below refuses to
# publish if they don't, because the source, the Info.plist and the tag are three
# copies of one number and AltStore decides whether an update exists by comparing
# its copy to the installed app's CFBundleShortVersionString. Let them drift and
# either nobody is offered the update or everybody is offered it forever.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Same build as a push to main — build-ipa.yml is called rather than copied, so
  # the xcodebuild flags can't drift between a test build and a released one.
  build:
    uses: ./.github/workflows/build-ipa.yml

  publish:
    needs: build
    # No Xcode needed past this point, and Linux minutes bill at 1x against
    # macOS's 10x. The whole job is Python and git.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so the tag's message is readable below

      - name: Check the tag agrees with project.yml
        id: tagcheck
        run: |
          set -euo pipefail
          RAW="${GITHUB_REF_NAME#v}"

          # A trailing -suffix marks a pre-release without changing the version
          # being published: v1.0-beta and v1.0 both carry version 1.0. That
          # keeps MARKETING_VERSION the single numeric value a human sets, and
          # keeps CFBundleShortVersionString from ever holding something
          # non-numeric — which is also why the suffix can't live in the
          # version itself.
          TAG_VERSION="${RAW%%-*}"
          SUFFIX="${RAW#"$TAG_VERSION"}"
          MARKETING="${{ needs.build.outputs.marketing }}"

          if [ "$TAG_VERSION" != "$MARKETING" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} means version ${TAG_VERSION}, but project.yml has MARKETING_VERSION ${MARKETING}."
            echo "::error::Fix one of them and retag. Nothing has been published."
            exit 1
          fi

          if [ -n "$SUFFIX" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag and project.yml agree on ${MARKETING}. Suffix ${SUFFIX} -> GitHub Release marked pre-release."
            echo "Note: SideStore ignores that flag. The source offers this build to every subscriber regardless."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag and project.yml agree on ${MARKETING}."
          fi

      # The "-release" artifact, not the plain one. build-ipa.yml uploads the
      # .ipa twice: the plain artifact uses archive: false so that a browser
      # download is the .ipa itself, and that same flag makes download-artifact
      # unpack it here — an .ipa is a zip, so what lands is Payload/ and no .ipa
      # at all. The -release copy uses default archiving and survives the trip.
      # See the comment beside both uploads in build-ipa.yml.
      #
      # The version must also match the upload-artifact version over there.
      - name: Download the .ipa built above
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.name }}-release
          path: dist

      # Resolved by search rather than reconstructed from the name, so a future
      # change to either the artifact naming or download-artifact's unpacking
      # can't silently point the Release and the source at a file that isn't
      # there. A wrong path here would publish a downloadURL that 404s.
      - name: Locate the .ipa
        id: ipa
        run: |
          # Deliberately not `set -e` here. The first version of this step was
          # `find dist -name '*.ipa' | head -n1` under `set -euo pipefail`, which
          # fails two ways: `head` closing the pipe early hands `find` a SIGPIPE,
          # so pipefail reports failure even when the file WAS found; and if
          # dist/ is missing, `find` exits non-zero and -e kills the step before
          # the diagnostic below ever prints. It failed silently for one of those
          # two reasons and there was no way to tell which.
          set -u

          echo "--- everything under dist/ ---"
          ls -laR dist 2>/dev/null || echo "(no dist directory at all)"
          echo "--- workspace root ---"
          ls -la

          # -print -quit rather than a pipe: no second process, no SIGPIPE.
          FOUND=$(find dist -type f -name '*.ipa' -print -quit 2>/dev/null)

          # The artifact is a single file, so if the extension didn't survive the
          # round trip, the only regular file under dist/ is still the right one.
          if [ -z "$FOUND" ]; then
            COUNT=$(find dist -type f 2>/dev/null | wc -l)
            if [ "$COUNT" = "1" ]; then
              FOUND=$(find dist -type f -print -quit 2>/dev/null)
              echo "No .ipa extension, but dist/ holds exactly one file. Using it."
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "::error::No .ipa under dist/ after download — see the listing above."
            exit 1
          fi

          echo "path=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Using $FOUND ($(stat -c%s "$FOUND") bytes)"

      - name: Read the changelog out of the tag
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"

          # actions/checkout leaves the tag as a lightweight ref, so
          # %(contents:body) returns the *commit* message rather than the tag's
          # annotation — and for a one-line commit that's a bare newline. Fetch
          # the real tag object back before reading it.
          #
          # Paid for on 18 Sept 2026: the first release that got all the way
          # through shipped with "Version 1.0" as its notes, because of this and
          # the blank-check below together.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true

          blank() { [ -z "$(printf '%s' "$1" | tr -d '[:space:]')" ]; }

          MSG=$(git tag -l --format='%(contents:body)' "$TAG")
          if blank "$MSG"; then
            MSG=$(git tag -l --format='%(contents:subject)' "$TAG")
          fi
          if blank "$MSG"; then
            MSG="Version ${TAG#v}"
            echo "::warning::Tag ${TAG} carries no annotation. Release notes will be a generated line."
          fi

          printf '%s\n' "$MSG" > changelog.txt
          echo "--- changelog ---"
          cat changelog.txt

      # The Release is what actually hosts the .ipa. source.json only points at it,
      # so this has to succeed before the source is updated — a source entry whose
      # downloadURL 404s is worse than no entry at all.
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog.txt
          files: ${{ steps.ipa.outputs.path }}
          fail_on_unmatched_files: true
          prerelease: ${{ steps.tagcheck.outputs.prerelease }}

      # A tag build is a detached HEAD, and public/source.json lives on main where
      # it accumulates one entry per release. It has to be edited against main's
      # copy: writing to the tagged commit's copy would silently drop every
      # version published since that commit was made. changelog.txt and dist/
      # are untracked, so switching branches leaves them alone.
      - name: Switch to main before touching source.json
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Update source.json
        run: |
          set -euo pipefail
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ needs.build.outputs.name }}.ipa"

          python3 scripts/build_source.py \
            --config source.config.json \
            --source public/source.json \
            --ipa "${{ steps.ipa.outputs.path }}" \
            --version "${{ needs.build.outputs.marketing }}" \
            --build-version "${{ needs.build.outputs.build }}" \
            --download-url "$DOWNLOAD_URL" \
            --changelog-file changelog.txt

      # Committing to main is what deploys: Cloudflare Pages watches this branch
      # and redeploys public/ on every push.
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/source.json
          if git diff --quiet --cached; then
            echo "source.json unchanged — nothing to push."
          else
            git commit -m "source: publish ${{ needs.build.outputs.marketing }} (build ${{ needs.build.outputs.build }})"
            git push origin main
            echo "Pushed. Cloudflare Pages redeploys in a minute or two."
          fi
