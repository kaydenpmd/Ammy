name: Jitter repro

# Builds lab/Repro, the minimal reproduction for Apple, and uploads it as an
# Xcode project ready to attach to a Feedback report. jitter-lab branch only.

on:
  push:
    branches: [jitter-lab]
    paths:
      - 'lab/Repro/**'
      - '.github/workflows/jitter-repro.yml'
  workflow_dispatch:

jobs:
  repro:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate and build
        run: |
          set -o pipefail
          cd lab/Repro
          xcodegen generate
          xcodebuild build -project SafeAreaBarLargeTitle.xcodeproj -scheme SafeAreaBarLargeTitle \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../dd-repro \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error|BUILD" | tail -20
      - name: Package
        run: |
          mkdir -p out/SafeAreaBarLargeTitle
          cp -R lab/Repro/Repro lab/Repro/SafeAreaBarLargeTitle.xcodeproj out/SafeAreaBarLargeTitle/
          cd out && zip -qry SafeAreaBarLargeTitle.zip SafeAreaBarLargeTitle && ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: SafeAreaBarLargeTitle
          path: out/SafeAreaBarLargeTitle.zip
          archive: false
