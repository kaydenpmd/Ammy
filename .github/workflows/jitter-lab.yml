name: Jitter lab

# Runs only on the jitter-lab branch, never on main, and releases nothing:
# it builds lab/JitterLab, drives bar variants through the same scroll
# gestures in a simulator, and uploads the per-frame probe logs, screenshots
# and a screen recording. LAB_MODE "ammy" instead builds the real Ammy from
# this branch and records it being scrolled with its bar on the stack and on
# the Form.

on:
  push:
    branches: [jitter-lab]
    paths:
      - 'lab/JitterLab/**'
      - 'lab/JitterLabUITests/**'
      - 'lab/project.yml'
      - 'Ammy/**'
  workflow_dispatch:

env:
  LAB_MODE: ammy

jobs:
  lab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ios26
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app
          - name: ios27
            runner: xcode-27
            xcode: /Applications/Xcode_27.2_Release_Candidate.app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          X="${{ matrix.xcode }}"
          [ -d "$X" ] || X=/Applications/Xcode.app
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate projects
        run: |
          (cd lab && xcodegen generate)
          xcodegen generate

      - name: Create and boot an iPhone SE
        id: sim
        run: |
          set -euo pipefail
          # Newest runtime first; a runtime made for one device (27.1 on the
          # xcode-27 image is iPhone Duo's) refuses the others, so fall back.
          UDID=""
          for RUNTIME in $(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")], reverse=True)
          print(" ".join(r["identifier"] for r in rs))'); do
            for TYPE in iPhone-SE-3rd-generation iPhone-17e; do
              if UDID=$(xcrun simctl create "Lab $TYPE" "com.apple.CoreSimulator.SimDeviceType.$TYPE" "$RUNTIME" 2>/dev/null); then
                echo "device: $TYPE on $RUNTIME"
                echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
                break 2
              fi
              UDID=""
            done
          done
          [ -n "$UDID" ] || { echo "no usable simulator"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for testing
        run: |
          set -o pipefail
          cd lab
          xcodebuild build-for-testing \
            -project JitterLab.xcodeproj -scheme JitterLab \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60

      - name: Build and install Ammy
        if: env.LAB_MODE == 'ammy'
        run: |
          set -o pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcodebuild build \
            -project Ammy.xcodeproj -scheme Ammy -configuration Release \
            -destination "id=$UDID" \
            -derivedDataPath build-ammy \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error|warning: .*AmmyApp|BUILD" | tail -40
          xcrun simctl install "$UDID" build-ammy/Build/Products/Release-iphonesimulator/Ammy.app
          xcrun simctl privacy "$UDID" grant media-library com.local.ammy || true

      - name: Run
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p out
          if [ "$LAB_MODE" = "ammy" ]; then
            ONLY="-only-testing:JitterLabUITests/AmmyUITests"
          else
            ONLY=""
          fi
          python3 -c 'import time; print(time.time())' > out/record-start.txt
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/lab.mp4 > out/record.log 2>&1 &
          REC=$!
          sleep 3
          TEST_RUNNER_LAB_OUT="$PWD/out" xcodebuild test-without-building \
            -project lab/JitterLab.xcodeproj -scheme JitterLab \
            -destination "id=$UDID" \
            -derivedDataPath lab/dd \
            -parallel-testing-enabled NO \
            $ONLY \
            CODE_SIGNING_ALLOWED=NO > out/xcodebuild-test.log 2>&1 || echo "tests exited $?"
          kill -INT $REC || true
          wait $REC || true
          tail -30 out/xcodebuild-test.log
          ls -la out | head -80

      - name: Demangle stacks
        run: |
          for f in $(find out -name '*.jsonl'); do
            xcrun swift-demangle --simplified < "$f" > "${f%.jsonl}.dm"
          done
          du -sh out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-${{ matrix.name }}
          path: out
