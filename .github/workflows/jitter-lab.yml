name: Jitter lab (inline title)

# Runs only on the jitter-lab-inline branch, never on main, and releases
# nothing. Option 2 of the section-header question: an inline title with the
# bar back on the Form.
#
# This version covers the pairing the owner's phone runs: Ammy built as
# build-ipa.yml builds it, on the macos-26 image's default Xcode (the iOS 26
# SDK), installed on an iOS 27.0 simulator. The first job builds that app;
# the second builds the lab's UI tests with Xcode 27.2 and drives the real
# Ammy by bundle ID, with the probe in it and its layout picked at launch
# (A "largeForm", B "inlineForm", C "inlineStack", and build 156 as "main"),
# plus History opened and left every way. The earlier version of this file
# (commit 6677739) ran the lab's own variants on iOS 26.5 and 27.0.

on:
  push:
    branches: [jitter-lab-inline]
  workflow_dispatch:

jobs:
  ammy-sdk26:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show the default Xcode, as build-ipa.yml uses it
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Ammy for the simulator
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build \
            -project Ammy.xcodeproj -scheme Ammy -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ammy \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error|warning: .*(AmmyApp|LabProbe)|BUILD" | tail -40
          P=build-ammy/Build/Products/Release-iphonesimulator/Ammy.app
          plutil -p "$P/Info.plist" | grep -E "DTSDKName|DTXcode|DTPlatformVersion|MinimumOSVersion|CFBundleIdentifier"
          lipo -info "$P/Ammy"
          tar -czf Ammy-sdk26.tgz -C build-ammy/Build/Products/Release-iphonesimulator Ammy.app

      - uses: actions/upload-artifact@v7
        with:
          name: ammy-sdk26
          path: Ammy-sdk26.tgz

  lab:
    needs: ammy-sdk26
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      XCODE: /Applications/Xcode_27.2_Release_Candidate.app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the lab project
        run: (cd lab && xcodegen generate)

      - name: Create and boot an iPhone SE
        id: sim
        run: |
          set -euo pipefail
          # Newest runtime first; a runtime made for one device (27.1 on the
          # xcode-27 image is iPhone Duo's) refuses the others, so fall back.
          UDID=""
          for RUNTIME in $(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")], reverse=True)
          print(" ".join(r["identifier"] for r in rs))'); do
            for TYPE in iPhone-SE-3rd-generation; do
              if UDID=$(xcrun simctl create "Lab $TYPE" "com.apple.CoreSimulator.SimDeviceType.$TYPE" "$RUNTIME" 2>/dev/null); then
                echo "device: $TYPE on $RUNTIME"
                echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
                break 2
              fi
              UDID=""
            done
          done
          [ -n "$UDID" ] || { echo "no usable simulator"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p out
          { echo "device: $TYPE"; echo "runtime: $RUNTIME"; echo "test runner:"; xcodebuild -version; } > out/device.txt

      - name: Build the UI tests
        run: |
          set -o pipefail
          cd lab
          xcodebuild build-for-testing \
            -project JitterLab.xcodeproj -scheme JitterLab \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -30

      - uses: actions/download-artifact@v4
        with:
          name: ammy-sdk26

      - name: Install the iOS 26 SDK build of Ammy
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p ammy-app && tar -xzf Ammy-sdk26.tgz -C ammy-app
          { echo "Ammy built with:"; plutil -p ammy-app/Ammy.app/Info.plist | grep -E "DTSDKName|DTXcode|DTPlatformVersion|MinimumOSVersion"; } | tee -a out/device.txt
          xcrun simctl install "$UDID" ammy-app/Ammy.app
          xcrun simctl privacy "$UDID" grant media-library com.local.ammy || true

      - name: Run
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p out
          python3 -c 'import time; print(time.time())' > out/record-start.txt
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/lab.mp4 > out/record.log 2>&1 &
          REC=$!
          sleep 3
          TEST_RUNNER_LAB_OUT="$PWD/out" xcodebuild test-without-building \
            -project lab/JitterLab.xcodeproj -scheme JitterLab \
            -destination "id=$UDID" \
            -derivedDataPath lab/dd \
            -parallel-testing-enabled NO \
            -only-testing:JitterLabUITests/AmmyUITests \
            CODE_SIGNING_ALLOWED=NO > out/xcodebuild-test.log 2>&1 || echo "tests exited $?"
          kill -INT $REC || true
          wait $REC || true
          grep -E "Test Case|error|passed|failed" out/xcodebuild-test.log | tail -30
          ls -la out | head -80

      - name: Demangle stacks
        run: |
          for f in $(find out -name '*.jsonl'); do
            xcrun swift-demangle --simplified < "$f" > "${f%.jsonl}.dm"
          done
          du -sh out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-ios27-sdk26
          path: out
