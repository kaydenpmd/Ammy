# Shell lab: how macOS shows a shell command that an app will run, for the
# owner's question of 12 Nov 2026 (Issun's Install Tailscale command link).
# Apple's guides have no picture of it, so this captures the real thing:
# Automator's Run Shell Script action, the Apple app whose control is a
# command shown in an editable field and run from the window. Branch
# shell-lab, never merged; results go to the design library.
name: Shell lab (macOS Run Shell Script)

on:
  push:
    branches: [shell-lab]
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos27
            runner: xcode-27
          - name: macos26
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Describe the machine, and switch to dark mode
        run: |
          mkdir -p out
          sw_vers | tee out/sw_vers.txt
          system_profiler SPDisplaysDataType | tee out/displays.txt
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' \
            && echo "dark mode on" | tee out/appearance.txt || echo "couldn't switch to dark mode" | tee out/appearance.txt
          defaults read -g AppleInterfaceStyle 2>&1 | tee -a out/appearance.txt || true
          ls "/System/Library/Automator/" | grep -i shell | tee out/actions.txt || true
          ls -d /System/Applications/Automator.app /Applications/Automator.app 2>&1 | tee -a out/actions.txt || true
          defaults read /System/Applications/Automator.app/Contents/Info CFBundleShortVersionString 2>&1 | tee out/automator-version.txt || true

      - name: Open Automator and add Run Shell Script by hand, through accessibility only
        run: |
          set -x
          brew install cliclick >/dev/null 2>&1 || true
          open -a Automator; sleep 6
          osascript -e 'tell application "System Events" to tell process "Automator" to set frontmost to true' || true
          osascript -e 'tell application "System Events" to tell process "Automator" to click button "Choose" of sheet 1 of window 1' 2>&1 | tee out/make.log || true
          sleep 3
          # Every element with its frame, as "role|description|name|value|x,y wxh".
          cat > out/dump.applescript <<'EOF'
          set out to ""
          tell application "System Events" to tell process "Automator"
            repeat with e in (entire contents of window 1)
              try
                set p to position of e as list
                set s to size of e as list
                set out to out & (role of e) & "|" & (description of e) & "|" & (name of e as text) & "|" & (value of e as text) & "|" & (item 1 of p) & "," & (item 2 of p) & " " & (item 1 of s) & "x" & (item 2 of s) & linefeed
              end try
            end repeat
          end tell
          return out
          EOF
          center() { python3 - "$1" "$2" <<'PY'
          import sys
          role, want = sys.argv[1], sys.argv[2]
          for line in open("out/dump.txt"):
              parts = line.rstrip("\n").split("|")
              if len(parts) < 5: continue
              if parts[0] == role and want in "|".join(parts[1:4]):
                  pos, size = parts[4].split(" ")
                  x, y = map(float, pos.split(",")); w, h = map(float, size.split("x"))
                  if w > 0 and h > 0:
                      print(f"{int(x + w / 2)},{int(y + h / 2)}"); break
          PY
          }
          # Positions read off the first runs' screenshots (1x, 1024 x 768 screen):
          # the search field at 260,111 and its first result at 245,144.
          cliclick c:260,111; sleep 1
          osascript -e 'tell application "System Events" to keystroke "Run Shell Script"' || true
          sleep 3
          cliclick dc:245,144; sleep 4
          screencapture -x out/step-added.png || true
          # The added action's command box: try a column of points down the
          # workflow pane until one gives the box focus, then type.
          for Y in 190 210 230 250 270; do cliclick c:690,$Y; sleep 0.5; done
          cliclick c:690,215; sleep 1
          osascript -e 'tell application "System Events" to keystroke "a" using command down' || true
          osascript -e 'tell application "System Events" to keystroke "winget install --id Tailscale.Tailscale --exact"' || true
          sleep 1
          screencapture -x out/step-typed.png || true          # Click away from the box so it shows at rest.
          cliclick c:700,450 || true
          sleep 2
      - name: Capture the window and its elements, then run it and capture again
        run: |
          set -x
          screencapture -x out/automator-screen.png || true
          cat > out/elements.applescript <<'EOF'
          set out to ""
          tell application "System Events" to tell process "Automator"
            set w to window 1
            set out to "window " & (name of w) & " pos " & (item 1 of (position of w as list)) & "," & (item 2 of (position of w as list)) & " size " & (item 1 of (size of w as list)) & "," & (item 2 of (size of w as list)) & linefeed
            repeat with e in (entire contents of w)
              try
                set p to position of e as list
                set s to size of e as list
                set out to out & (role of e) & " | " & (description of e) & " | " & (name of e as text) & " | " & (value of e as text) & " | " & (item 1 of p) & "," & (item 2 of p) & " " & (item 1 of s) & "x" & (item 2 of s) & linefeed
              end try
            end repeat
          end tell
          return out
          EOF
          osascript out/elements.applescript > out/elements.txt 2> out/elements.err || true
          head -c 3000 out/elements.txt
          R=$(head -1 out/elements.txt | sed -E 's/.* pos ([0-9]+),([0-9]+) size ([0-9]+),([0-9]+).*/\1,\2,\3,\4/')
          echo "region $R" | tee out/window.txt
          [ -n "$R" ] && screencapture -x -R"$R" out/automator-window.png || true
          osascript -e 'tell application "System Events" to tell process "Automator" to click button "Run" of toolbar 1 of window 1' > out/run.log 2>&1 || \
            osascript -e 'tell application "System Events" to tell process "Automator" to keystroke "r" using command down' >> out/run.log 2>&1 || true
          sleep 5
          [ -n "$R" ] && screencapture -x -R"$R" out/automator-window-after-run.png || true
          screencapture -x out/automator-screen-after-run.png || true
          osascript out/elements.applescript > out/elements-after-run.txt 2>&1 || true
          ls -la out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shell-lab-${{ matrix.name }}
          path: out
