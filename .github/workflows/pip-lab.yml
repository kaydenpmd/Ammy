name: PiP lab (the Picture in Picture window over the bar)

# Runs only on the pip-lab branch, never on main, and releases nothing.
# The question, 18 Nov 2026: the owner thinks things like Picture in Picture
# should float above Ammy's Start/Stop button. Where does iOS put the PiP
# window over an app's bottom controls: over Ammy as released (main, built as
# build-ipa.yml builds it), over Apple's apps with a tab bar, and over each
# kind of bottom bar (lab/Bars)? And does the system have anything an app can
# use to tell PiP where its controls are? In dark mode.
#
# Run 44275708353 (SE and 17e on iOS 27.0) found the iPhone simulators don't
# support PiP at all (isPictureInPictureSupported false), so this run tries:
#   ipad-ios27    an iPad Air 11-inch on iOS 27.0, which has PiP
#   se-pip-ios27  a copy of the SE's device type claiming the iPad's PiP
#                 capabilities (lab/fakepip.py), if it has any

on:
  push:
    branches: [pip-lab]
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Show the default Xcode, as build-ipa.yml uses it
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Ammy for the simulator
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build \
            -project Ammy.xcodeproj -scheme Ammy -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ammy \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error|BUILD" | tail -40
          P=build-ammy/Build/Products/Release-iphonesimulator/Ammy.app
          plutil -p "$P/Info.plist" | grep -E "DTSDKName|DTXcode|DTPlatformVersion|MinimumOSVersion|CFBundleIdentifier"
          tar -czf Ammy-sim.tgz -C build-ammy/Build/Products/Release-iphonesimulator Ammy.app

      - uses: actions/upload-artifact@v7
        with:
          name: ammy-sim
          path: Ammy-sim.tgz

  lab:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ipad-ios27
            runner: xcode-27
            xcode: /Applications/Xcode_27.2_Release_Candidate.app
            device: "iPad Air 11"
            runtime: "27.0"
          - name: se-pip-ios27
            runner: xcode-27
            xcode: /Applications/Xcode_27.2_Release_Candidate.app
            device: fakepip
            runtime: "27.0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          X="${{ matrix.xcode }}"
          [ -d "$X" ] || X=/Applications/Xcode.app
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the lab project
        run: cd lab && xcodegen generate

      - name: Create and boot the simulator
        id: sim
        run: |
          set -euo pipefail
          mkdir -p out
          WANT="${{ matrix.runtime }}"
          if [ "${{ matrix.device }}" = "fakepip" ]; then
            TYPE=$(python3 lab/fakepip.py "$PWD/out" || true)
            if [ -n "$TYPE" ]; then
              # CoreSimulator reads the user's device types when it starts.
              killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
              sleep 3
              xcrun simctl list devicetypes | grep -i "PiP" || echo "the copy isn't listed"
            else
              TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation
            fi
          else
            TYPE=$(xcrun simctl list devicetypes -j | NAME="${{ matrix.device }}" python3 -c '
          import json, os, sys
          ts = [t for t in json.load(sys.stdin)["devicetypes"] if os.environ["NAME"] in t["name"]]
          print(ts[-1]["identifier"])')
          fi
          echo "device type: $TYPE"
          UDID=""
          for RUNTIME in $(xcrun simctl list runtimes -j | WANT="$WANT" python3 -c '
          import json, os, sys
          want = os.environ["WANT"]
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rs.sort(key=lambda r: (r["version"] == want or r["version"].startswith(want + "."),
                                 [int(x) for x in r["version"].split(".")]), reverse=True)
          print(" ".join(r["identifier"] for r in rs))'); do
            if UDID=$(xcrun simctl create "Lab ${{ matrix.name }}" "$TYPE" "$RUNTIME" 2>/dev/null); then
              echo "device: $TYPE on $RUNTIME"
              echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
              break
            fi
            UDID=""
          done
          [ -n "$UDID" ] || { echo "no usable simulator"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          # simctl itself crashed here once (devicePair, run 44275708353's SE
          # job) with the simulator booting fine underneath, so ask again.
          for attempt in 1 2 3; do
            if xcrun simctl bootstatus "$UDID" -b; then break; fi
            echo "bootstatus failed (attempt $attempt)"
            sleep 10
          done
          xcrun simctl ui "$UDID" appearance dark
          { echo "device type: $TYPE"; echo "runtime: $RUNTIME"; echo "test runner:"; xcodebuild -version; } > out/device.txt
          xcrun simctl list runtimes -j | RT="$RUNTIME" python3 -c '
          import json, os, sys
          for r in json.load(sys.stdin)["runtimes"]:
              if r["identifier"] == os.environ["RT"]:
                  print(json.dumps(r, indent=1))' > out/runtime.json

      - name: Look for anything an app could tell PiP
        run: |
          # Every string in UIKit, AVKit, SpringBoard and the PiP frameworks
          # (Pegasus) that names PiP beside a word about room or placement: a
          # public or private way for an app to say where its controls are
          # would show up here as a selector or key. Each string is listed
          # with the binary it came from.
          ROOT=$(python3 -c '
          import json
          r = json.load(open("out/runtime.json"))
          print(r.get("runtimeRoot") or r["bundlePath"] + "/Contents/Resources/RuntimeRoot")')
          echo "runtime root: $ROOT" | tee out/strings-where.txt
          find "$ROOT/System/Library" -type f -size +50k \( \
              -path '*UIKitCore.framework/UIKitCore' -o \
              -path '*SpringBoard.app/SpringBoard' -o \
              -path '*/SpringBoard*.framework/SpringBoard*' -o \
              -path '*/Pegasus*.framework/Pegasus*' -o \
              -path '*AVKit.framework/AVKit' -o \
              -path '*FrontBoardServices.framework/FrontBoardServices' -o \
              -path '*UIKitServices.framework/UIKitServices' \) \
              2>/dev/null | sort > out/strings-files.txt || true
          cat out/strings-files.txt | tee -a out/strings-where.txt
          : > out/strings-pip.txt
          while IFS= read -r f; do
            strings -a -n 6 "$f" \
              | grep -E 'PIP|PiP|[a-z]Pip|pip[A-Z]|[Pp]ictureInPicture|Pegasus' \
              | grep -iE 'inset|avoid|exclu|obstruct|occlu|margin|region|padding|safearea|keyboard|tabbar|toolbar|bottom|edge|dodg' \
              | sort -u | sed "s|^|$(basename "$f"): |" >> out/strings-pip.txt || true
          done < out/strings-files.txt
          # UIKit, AVKit and the Pegasus frameworks weren't loose files in run
          # 44275708353's runtime: they live in the shared cache. The cache
          # doesn't say which framework a string is from, so look only for
          # the words a way to steer PiP would use.
          find "$ROOT" /Library/Developer/CoreSimulator "$HOME/Library/Developer/CoreSimulator/Caches" \
              -name 'dyld_sim_shared_cache_*' -not -name '*.map' -not -name '*.atlas' 2>/dev/null \
              | sort -u > out/strings-caches.txt || true
          cat out/strings-caches.txt | tee -a out/strings-where.txt
          : > out/strings-cache-pip.txt
          while IFS= read -r f; do
            strings -a -n 6 "$f" \
              | grep -E '[Dd]odg|PIPInset|PiPInset|pipInset|PictureInPictureInset|pictureInPictureInset|PictureInPictureMargin|pictureInPictureMargin|PIPMargin|PIPAvoid|pipAvoid|PictureInPictureAvoid|pictureInPictureAvoid|PictureInPictureExclu|pictureInPictureExclu|PIPExclu|pipExclu|PictureInPicturePadding|pictureInPicturePadding' \
              | sort -u | sed "s|^|$(basename "$f"): |" >> out/strings-cache-pip.txt || true
          done < out/strings-caches.txt
          wc -l out/strings-cache-pip.txt
          head -150 out/strings-cache-pip.txt
          wc -l out/strings-pip.txt
          head -150 out/strings-pip.txt

      - name: Build the lab apps and UI tests
        run: |
          set -o pipefail
          cd lab
          xcodebuild build-for-testing \
            -project PiPLab.xcodeproj -scheme PiPHost \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error|warning: .*PiP|BUILD" | tail -30
          xcodebuild build \
            -project PiPLab.xcodeproj -scheme Bars \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error|BUILD" | tail -30
          find dd/Build/Products -maxdepth 2 -name "*.app"

      - uses: actions/download-artifact@v7
        with:
          name: ammy-sim

      - name: Install Ammy and Bars
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p ammy-app && tar -xzf Ammy-sim.tgz -C ammy-app
          { echo "Ammy built with:"; plutil -p ammy-app/Ammy.app/Info.plist | grep -E "DTSDKName|DTXcode|DTPlatformVersion|MinimumOSVersion|CFBundleVersion"; } | tee -a out/device.txt
          xcrun simctl install "$UDID" ammy-app/Ammy.app
          xcrun simctl install "$UDID" "$(find lab/dd/Build/Products -maxdepth 2 -name Bars.app | head -1)"
          xcrun simctl privacy "$UDID" grant media-library com.local.ammy || true

      - name: Run
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          T=PiPLabUITests/PiPLabUITests
          stamp() { python3 -c 'import time; print(time.time())'; }
          stamp > out/record-start.txt
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/lab.mp4 > out/record.log 2>&1 &
          REC=$!
          sleep 3
          for attempt in 1 2; do
            echo "$(stamp) begin attempt $attempt" >> out/phases.txt
            TEST_RUNNER_LAB_OUT="$PWD/out" xcodebuild test-without-building \
              -project lab/PiPLab.xcodeproj -scheme PiPHost \
              -destination "id=$UDID" \
              -derivedDataPath lab/dd \
              -parallel-testing-enabled NO \
              -only-testing:"$T/testPiP" \
              CODE_SIGNING_ALLOWED=NO > "out/xcodebuild-$attempt.log" 2>&1 || echo "tests exited $?"
            echo "$(stamp) end attempt $attempt" >> out/phases.txt
            grep -E "Test Case|error:|failed|\[lab\]" "out/xcodebuild-$attempt.log" | tail -80 || true
            if grep -q "Test Case '-\[" "out/xcodebuild-$attempt.log"; then break; fi
          done
          kill -INT $REC || true
          wait $REC || true
          ls out | wc -l

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-${{ matrix.name }}
          path: out
