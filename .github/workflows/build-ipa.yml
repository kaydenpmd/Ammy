name: Build unsigned IPA and simulator app

on:
  # No direct push trigger here — publish-source.yml is the only thing that
  # calls this now, on every qualifying push to main, so there is exactly one
  # build (and one release) per push rather than this firing a second time on
  # top of it. See that file's own trigger and paths-ignore for what "every
  # build" actually means.
  #
  # Kept so a build can still be forced by hand independent of a release.
  workflow_dispatch:
  # The one place the xcodebuild flags live, called rather than duplicated so
  # a manually-forced build and a released one can't drift apart.
  workflow_call:
    outputs:
      name:
        description: "Artifact name, which is also the .ipa filename minus the extension."
        value: ${{ jobs.build.outputs.name }}
      marketing:
        description: "MARKETING_VERSION as read out of project.yml."
        value: ${{ jobs.build.outputs.marketing }}
      build:
        description: "CURRENT_PROJECT_VERSION, i.e. the commit count (git rev-list --count HEAD)."
        value: ${{ jobs.build.outputs.build }}

jobs:
  build:
    runs-on: macos-26

    outputs:
      name: ${{ steps.ver.outputs.name }}
      marketing: ${{ steps.ver.outputs.marketing }}
      build: ${{ steps.ver.outputs.build }}

    steps:
      # fetch-depth: 0 is load-bearing. The default checkout is shallow, and the
      # build number below is a commit count — against a shallow clone that
      # counts 1, and every build would claim to be build 1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build identity comes from CI, not from anyone remembering to bump a
      # number: the count of commits reachable from HEAD climbs on its own, and
      # the short SHA ties an installed build back to a commit. MARKETING_VERSION
      # stays the single human-set value in project.yml and is read back out here
      # so the two can't drift.
      #
      # This was github.run_number until 18 Sept 2026, and that broke the moment
      # publish-source.yml started calling this workflow. In a reusable workflow
      # the github context belongs to the *caller*, so run_number became the
      # publish workflow's own counter — which starts at 1. The first tag
      # release built as Ammy-1.0-b1, a number that had already been used and
      # that sits 54 below the build actually on the phone.
      #
      # A commit count doesn't care which workflow is running, which is the
      # property that was missing. The sequence jumps 55 -> 60 once, here, and
      # is continuous after that.
      - name: Work out the version
        id: ver
        run: |
          set -euo pipefail
          MARKETING=$(sed -nE 's/.*MARKETING_VERSION: *"?([^"]+)"?.*/\1/p' project.yml | head -1)
          SHA=$(git rev-parse --short HEAD)
          BUILD=$(git rev-list --count HEAD)
          if [ "$BUILD" -lt 56 ]; then
            echo "::error::Build number ${BUILD} is at or below the last run_number-based build (55)."
            echo "::error::Publishing it would move the build number backwards. Is this a shallow clone?"
            exit 1
          fi
          NAME="Ammy-${MARKETING}-b${BUILD}-${SHA}"
          echo "marketing=${MARKETING}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Building ${NAME}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device
        run: |
          xcodebuild \
            -project Ammy.xcodeproj \
            -scheme Ammy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.ver.outputs.marketing }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ammy.app Payload/
          zip -qry "${{ steps.ver.outputs.name }}.ipa" Payload

      # archive: false requires upload-artifact v7+. Without it GitHub zips the
      # upload, and since an .ipa is already a zip you download a zip containing
      # a zip and have to extract before SideStore will take it. With it, the
      # browser download is the .ipa itself.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.name }}
          path: ${{ steps.ver.outputs.name }}.ipa
          archive: false
          if-no-files-found: error

      # The same file again, with GitHub's normal archiving. publish-source.yml
      # downloads THIS one, unconditionally now — every call to this workflow
      # is for a release.
      #
      # archive: false above is what makes a browser download the .ipa itself
      # rather than a zip containing it — worth keeping, that is the artifact a
      # human grabs. But it has a consequence that only shows up when another
      # *job* downloads it: the upload is a bare file, so download-artifact
      # treats the artifact as an archive and unpacks it — and an .ipa is a zip,
      # so it extracts Payload/ and the .ipa ceases to exist. Paid for on
      # 18 Sept 2026, two failed releases deep.
      #
      # With default archiving the round trip is symmetric: upload wraps, download
      # unwraps, and the .ipa arrives intact. Costs ~4MB of artifact storage per
      # release, which is the cheapest available answer.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.name }}-release
          path: ${{ steps.ver.outputs.name }}.ipa
          if-no-files-found: error

      # Appetize only takes iOS Simulator builds — a .app, never an .ipa, and
      # it says so outright: "AppStore distribution device builds (.ipa) are
      # not currently supported." So this is a second build of the same source,
      # not a repackaging of the first, and it lands in its own derived data
      # directory so it cannot clobber the device products above.
      #
      # Worth remembering what it is good for. The Simulator has no Music app
      # and no media library, so systemMusicPlayer reads nothing and the whole
      # of NowPlayingMonitor is inert there; KeepAlive has no real eviction
      # pressure to survive either. What it *can* answer is layout on hardware
      # nobody here owns — an iPad, or a large foldable screen.
      - name: Build for simulator
        run: |
          xcodebuild \
            -project Ammy.xcodeproj \
            -scheme Ammy \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build-sim \
            MARKETING_VERSION=${{ steps.ver.outputs.marketing }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      # The .app has to sit at the root of the archive — no Payload/ wrapper,
      # which is the .ipa convention and not this one. -y keeps symlinks as
      # symlinks so a bundle with embedded frameworks survives the round trip.
      - name: Package for Appetize
        run: |
          cd build-sim/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/${{ steps.ver.outputs.name }}-simulator.zip" Ammy.app

      # archive: false for the same reason as the .ipa above — the file is
      # already a zip, and Appetize wants that zip rather than one wrapped in
      # another.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.name }}-simulator
          path: ${{ steps.ver.outputs.name }}-simulator.zip
          archive: false
          if-no-files-found: error
