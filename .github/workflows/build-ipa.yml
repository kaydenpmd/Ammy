name: Build unsigned IPA and simulator app

on:
  push:
    branches: [main]
    # Only build when something that can change the app changes. Relay and
    # documentation commits used to trigger a build each, which burned macOS
    # minutes and — worse — advanced the build number without a line of Swift
    # moving. The whole versioning scheme rests on the Version row matching the
    # artifact name, so a build number that climbs for reasons unrelated to the
    # app quietly erodes the one check that tells you what the phone is running.
    paths-ignore:
      - '**.md'
      - 'bridge/**'
  # Kept so a build can still be forced by hand when paths-ignore skips one.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      # Build identity comes from CI, not from anyone remembering to bump a
      # number: github.run_number increases on every run, and the short SHA ties
      # an installed build back to a commit. MARKETING_VERSION stays the single
      # human-set value in project.yml and is read back out here so the two
      # can't drift.
      - name: Work out the version
        id: ver
        run: |
          MARKETING=$(sed -nE 's/.*MARKETING_VERSION: *"?([^"]+)"?.*/\1/p' project.yml | head -1)
          SHA=$(git rev-parse --short HEAD)
          NAME="Ammy-${MARKETING}-b${{ github.run_number }}-${SHA}"
          echo "marketing=${MARKETING}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Building ${NAME}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device
        run: |
          xcodebuild \
            -project Ammy.xcodeproj \
            -scheme Ammy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.ver.outputs.marketing }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ammy.app Payload/
          zip -qry "${{ steps.ver.outputs.name }}.ipa" Payload

      # archive: false requires upload-artifact v7+. Without it GitHub zips the
      # upload, and since an .ipa is already a zip you download a zip containing
      # a zip and have to extract before SideStore will take it. With it, the
      # browser download is the .ipa itself.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.name }}
          path: ${{ steps.ver.outputs.name }}.ipa
          archive: false
          if-no-files-found: error

      # Appetize only takes iOS Simulator builds — a .app, never an .ipa, and
      # it says so outright: "AppStore distribution device builds (.ipa) are
      # not currently supported." So this is a second build of the same source,
      # not a repackaging of the first, and it lands in its own derived data
      # directory so it cannot clobber the device products above.
      #
      # Worth remembering what it is good for. The Simulator has no Music app
      # and no media library, so systemMusicPlayer reads nothing and the whole
      # of NowPlayingMonitor is inert there; KeepAlive has no real eviction
      # pressure to survive either. What it *can* answer is layout on hardware
      # nobody here owns — an iPad, or a large foldable screen.
      - name: Build for simulator
        run: |
          xcodebuild \
            -project Ammy.xcodeproj \
            -scheme Ammy \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build-sim \
            MARKETING_VERSION=${{ steps.ver.outputs.marketing }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      # The .app has to sit at the root of the archive — no Payload/ wrapper,
      # which is the .ipa convention and not this one. -y keeps symlinks as
      # symlinks so a bundle with embedded frameworks survives the round trip.
      - name: Package for Appetize
        run: |
          cd build-sim/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/${{ steps.ver.outputs.name }}-simulator.zip" Ammy.app

      # archive: false for the same reason as the .ipa above — the file is
      # already a zip, and Appetize wants that zip rather than one wrapped in
      # another.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.name }}-simulator
          path: ${{ steps.ver.outputs.name }}-simulator.zip
          archive: false
          if-no-files-found: error
